<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Groggu balla nella foresta 🌿</title>
<style>
  html, body { margin: 0; padding: 0; overflow: hidden; background: #1a2b1a; }
  #overlay {
    position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
    color: #e8f0d8; font-family: 'Segoe UI', sans-serif; text-align: center;
    text-shadow: 0 2px 8px rgba(0,0,0,.8); pointer-events: none; z-index: 10;
  }
  #overlay h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: 1px; }
  #overlay p { margin: 4px 0 0; font-size: 13px; opacity: .8; }
  #music {
    position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
    z-index: 10; padding: 10px 22px; border: none; border-radius: 24px;
    background: rgba(120, 160, 80, .85); color: #fff; font-size: 15px;
    font-family: 'Segoe UI', sans-serif; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,.5);
  }
  #music:hover { background: rgba(140, 185, 95, .95); }
</style>
</head>
<body>
<div id="overlay">
  <h1>🌿 Ballare devi, sì! 🌿</h1>
  <p>Trascina per ruotare &middot; rotella per lo zoom</p>
</div>
<button id="music">▶ Musica</button>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/"
  }
}
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------- Scena, camera, renderer ---------- */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x22331e);
scene.fog = new THREE.FogExp2(0x22331e, 0.055);

const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 100);
camera.position.set(0, 2.2, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.2, 0);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI / 2.05;
controls.minDistance = 3;
controls.maxDistance = 15;

/* ---------- Luci: sole tra gli alberi ---------- */
scene.add(new THREE.HemisphereLight(0xbfd98a, 0x1c2a14, 0.7));

const sun = new THREE.DirectionalLight(0xfff2cc, 1.6);
sun.position.set(3, 8, 4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -8; sun.shadow.camera.right = 8;
sun.shadow.camera.top = 8;  sun.shadow.camera.bottom = -8;
scene.add(sun);

const rim = new THREE.DirectionalLight(0x88aa66, 0.5);
rim.position.set(-4, 3, -4);
scene.add(rim);

/* ---------- Materiali ---------- */
const skinMat   = new THREE.MeshStandardMaterial({ color: 0x8fae5a, roughness: 0.75 });
const skinDark  = new THREE.MeshStandardMaterial({ color: 0x7a9a4c, roughness: 0.8 });
const robeMat   = new THREE.MeshStandardMaterial({ color: 0xc9bda3, roughness: 0.95 });
const furMat    = new THREE.MeshStandardMaterial({ color: 0xe3dbc8, roughness: 1.0 });
const eyeMat    = new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.15, metalness: 0.3 });
const barkMat   = new THREE.MeshStandardMaterial({ color: 0x4a3f2e, roughness: 1.0 });
const mossMat   = new THREE.MeshStandardMaterial({ color: 0x3d5a2b, roughness: 1.0 });
const leafMat   = new THREE.MeshStandardMaterial({ color: 0x2f4d22, roughness: 0.9 });
const fernMat   = new THREE.MeshStandardMaterial({ color: 0x4f7a33, roughness: 0.9, side: THREE.DoubleSide });

/* ---------- Il personaggio ---------- */
const character = new THREE.Group();
scene.add(character);

// Corpo: tunica a campana (lathe)
const robePts = [];
for (let i = 0; i <= 10; i++) {
  const t = i / 10;
  robePts.push(new THREE.Vector2(0.25 + 0.55 * Math.pow(t, 1.4), 1.05 - 1.05 * t));
}
const robe = new THREE.Mesh(new THREE.LatheGeometry(robePts, 32), robeMat);
robe.castShadow = robe.receiveShadow = true;
character.add(robe);

// Collo di pelliccia
const collar = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.13, 12, 24), furMat);
collar.position.y = 1.02;
collar.rotation.x = Math.PI / 2;
collar.castShadow = true;
character.add(collar);

// Gruppo testa (per il bob e il tilt)
const head = new THREE.Group();
head.position.y = 1.15;
character.add(head);

const skull = new THREE.Mesh(new THREE.SphereGeometry(0.45, 32, 24), skinMat);
skull.scale.set(1, 0.92, 0.95);
skull.position.y = 0.35;
skull.castShadow = true;
head.add(skull);

// Guance / muso leggermente in avanti
const muzzle = new THREE.Mesh(new THREE.SphereGeometry(0.3, 24, 16), skinMat);
muzzle.scale.set(1.05, 0.75, 0.8);
muzzle.position.set(0, 0.2, 0.22);
muzzle.castShadow = true;
head.add(muzzle);

// Occhi grandi e neri
for (const s of [-1, 1]) {
  const eye = new THREE.Mesh(new THREE.SphereGeometry(0.085, 20, 14), eyeMat);
  eye.position.set(0.16 * s, 0.36, 0.36);
  head.add(eye);
  const glint = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 8, 6),
    new THREE.MeshBasicMaterial({ color: 0xffffff })
  );
  glint.position.set(0.16 * s + 0.025, 0.39, 0.435);
  head.add(glint);
}

// Naso
const nose = new THREE.Mesh(new THREE.SphereGeometry(0.045, 12, 8), skinDark);
nose.position.set(0, 0.26, 0.47);
head.add(nose);

// Bocca (torus sottile schiacciato)
const mouth = new THREE.Mesh(new THREE.TorusGeometry(0.07, 0.012, 8, 16, Math.PI), skinDark);
mouth.position.set(0, 0.14, 0.44);
mouth.rotation.set(Math.PI, 0, 0);
head.add(mouth);

// Orecchie giganti (coni schiacciati), con pivot per farle sventolare
const ears = [];
for (const s of [-1, 1]) {
  const pivot = new THREE.Group();
  pivot.position.set(0.38 * s, 0.42, 0);
  const ear = new THREE.Mesh(new THREE.ConeGeometry(0.16, 0.85, 16), skinMat);
  ear.scale.z = 0.35;
  ear.rotation.z = -s * Math.PI / 2.15;
  ear.position.x = s * 0.4;
  ear.castShadow = true;
  pivot.add(ear);
  const tip = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), skinDark);
  tip.position.x = s * 0.82;
  pivot.add(tip);
  head.add(pivot);
  ears.push(pivot);
}

// Braccia con polsini di pelliccia e manine a tre dita
const arms = [];
for (const s of [-1, 1]) {
  const shoulder = new THREE.Group();
  shoulder.position.set(0.34 * s, 0.88, 0);
  character.add(shoulder);

  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.13, 0.5, 12), robeMat);
  sleeve.position.set(s * 0.18, -0.14, 0);
  sleeve.rotation.z = s * 0.9;
  sleeve.castShadow = true;
  shoulder.add(sleeve);

  const cuff = new THREE.Mesh(new THREE.TorusGeometry(0.11, 0.055, 10, 18), furMat);
  cuff.position.set(s * 0.36, -0.26, 0);
  cuff.rotation.y = Math.PI / 2;
  cuff.rotation.z = s * 0.9;
  cuff.castShadow = true;
  shoulder.add(cuff);

  const hand = new THREE.Group();
  hand.position.set(s * 0.46, -0.33, 0);
  for (let f = -1; f <= 1; f++) {
    const finger = new THREE.Mesh(new THREE.CapsuleGeometry(0.028, 0.1, 4, 8), skinMat);
    finger.position.set(s * 0.05, -0.05, f * 0.05);
    finger.rotation.z = s * 0.6;
    finger.castShadow = true;
    hand.add(finger);
  }
  shoulder.add(hand);
  arms.push(shoulder);
}

// Piedini verdi che spuntano dalla tunica
for (const s of [-1, 1]) {
  const foot = new THREE.Mesh(new THREE.SphereGeometry(0.1, 14, 10), skinMat);
  foot.scale.set(1, 0.55, 1.5);
  foot.position.set(0.22 * s, 0.05, 0.32);
  foot.castShadow = true;
  character.add(foot);
}

/* ---------- La foresta ---------- */
// Terreno muschioso
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 48), mossMat);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// Tronco caduto dietro al personaggio
const log = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.4, 6, 12), barkMat);
log.rotation.z = Math.PI / 2;
log.rotation.y = 0.3;
log.position.set(0.5, 0.35, -1.8);
log.castShadow = log.receiveShadow = true;
scene.add(log);
const logMoss = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.42, 5.6, 12, 1, false, 0, Math.PI), mossMat);
logMoss.rotation.z = Math.PI / 2;
logMoss.rotation.y = 0.3;
logMoss.position.copy(log.position);
scene.add(logMoss);

// Alberi
function makeTree(x, z, h, r) {
  const tree = new THREE.Group();
  const trunk = new THREE.Mesh(new THREE.CylinderGeometry(r * 0.55, r, h, 10), barkMat);
  trunk.position.y = h / 2;
  trunk.castShadow = true;
  tree.add(trunk);
  for (let i = 0; i < 3; i++) {
    const blob = new THREE.Mesh(new THREE.SphereGeometry(h * (0.32 - i * 0.05), 12, 10), leafMat);
    blob.position.set((Math.random() - 0.5) * h * 0.35, h * (0.75 + i * 0.18), (Math.random() - 0.5) * h * 0.35);
    blob.castShadow = true;
    tree.add(blob);
  }
  tree.position.set(x, 0, z);
  scene.add(tree);
}
const treeSpots = [
  [-4, -4, 7, 0.5], [4.5, -5, 8, 0.6], [-6, -1, 6, 0.45], [6, -1.5, 6.5, 0.5],
  [-3, -7, 9, 0.7], [2.5, -8, 8, 0.6], [-7.5, -5, 7, 0.55], [7, -6, 9, 0.65],
  [-5, 3, 6, 0.4], [5.5, 3.5, 6, 0.45], [-8, 1, 7, 0.5], [8, 0.5, 7, 0.5],
];
for (const [x, z, h, r] of treeSpots) makeTree(x, z, h, r);

// Felci: ventagli di piani triangolari
function makeFern(x, z, scale) {
  const fern = new THREE.Group();
  const nLeaves = 7;
  for (let i = 0; i < nLeaves; i++) {
    const leaf = new THREE.Mesh(new THREE.PlaneGeometry(0.12, 0.7), fernMat);
    leaf.position.y = 0.3;
    const holder = new THREE.Group();
    holder.rotation.y = (i / nLeaves) * Math.PI * 2;
    holder.rotation.z = 0.65;
    holder.add(leaf);
    fern.add(holder);
  }
  fern.scale.setScalar(scale);
  fern.position.set(x, 0, z);
  scene.add(fern);
  return fern;
}
const ferns = [];
for (let i = 0; i < 14; i++) {
  const a = Math.random() * Math.PI * 2;
  const d = 2 + Math.random() * 6;
  ferns.push(makeFern(Math.cos(a) * d, Math.sin(a) * d, 0.7 + Math.random() * 0.9));
}

// Nebbiolina: sprite piatti semitrasparenti che scorrono
const mistMat = new THREE.MeshBasicMaterial({ color: 0xcfe0c0, transparent: true, opacity: 0.06, depthWrite: false });
const mists = [];
for (let i = 0; i < 6; i++) {
  const m = new THREE.Mesh(new THREE.PlaneGeometry(8, 1.6), mistMat);
  m.position.set((Math.random() - 0.5) * 8, 0.4 + Math.random() * 1.2, -3 + Math.random() * 5);
  scene.add(m);
  mists.push(m);
}

// Raggio di sole volumetrico finto
const beam = new THREE.Mesh(
  new THREE.ConeGeometry(2.2, 9, 24, 1, true),
  new THREE.MeshBasicMaterial({ color: 0xfff6d0, transparent: true, opacity: 0.05, depthWrite: false, side: THREE.DoubleSide })
);
beam.position.set(1.2, 4.5, -1);
beam.rotation.z = -0.25;
scene.add(beam);

// Particelle: polline/lucciole
const pCount = 120;
const pGeo = new THREE.BufferGeometry();
const pPos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  pPos[i * 3] = (Math.random() - 0.5) * 14;
  pPos[i * 3 + 1] = Math.random() * 5;
  pPos[i * 3 + 2] = (Math.random() - 0.5) * 14;
}
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
const particles = new THREE.Points(pGeo, new THREE.PointsMaterial({
  color: 0xf5ffd0, size: 0.045, transparent: true, opacity: 0.8, depthWrite: false
}));
scene.add(particles);

/* ---------- Musica: groove sintetizzato con WebAudio ---------- */
let audioCtx = null, musicOn = false, nextBeat = 0, beatIndex = 0;
const BPM = 112;
const musicBtn = document.getElementById('music');

function kick(t) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(45, t + 0.12);
  g.gain.setValueAtTime(0.5, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.3);
}
function hat(t) {
  const buf = audioCtx.createBuffer(1, 2205, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3);
  const src = audioCtx.createBufferSource(); src.buffer = buf;
  const f = audioCtx.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = 7000;
  const g = audioCtx.createGain(); g.gain.value = 0.12;
  src.connect(f).connect(g).connect(audioCtx.destination);
  src.start(t);
}
function pluck(t, freq) {
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = 'triangle';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.16, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
  o.connect(g).connect(audioCtx.destination);
  o.start(t); o.stop(t + 0.35);
}
const bassLine = [110, 110, 165, 110, 131, 110, 98, 147]; // groove in La minore
function scheduleMusic() {
  if (!musicOn) return;
  const beatLen = 60 / BPM / 2; // ottavi
  while (nextBeat < audioCtx.currentTime + 0.3) {
    const b = beatIndex % 8;
    if (b % 2 === 0) kick(nextBeat);
    hat(nextBeat + beatLen / 2);
    pluck(nextBeat, bassLine[b]);
    if (b === 4) pluck(nextBeat, 220);
    nextBeat += beatLen;
    beatIndex++;
  }
}
musicBtn.addEventListener('click', () => {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  musicOn = !musicOn;
  if (musicOn) { nextBeat = audioCtx.currentTime + 0.1; beatIndex = 0; }
  musicBtn.textContent = musicOn ? '⏸ Pausa' : '▶ Musica';
});

/* ---------- La danza ---------- */
const clock = new THREE.Clock();
const beatHz = BPM / 60;

function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const beat = t * beatHz * Math.PI;       // fase sul beat
  scheduleMusic();

  // Rimbalzo sul posto + squash & stretch
  const bounce = Math.abs(Math.sin(beat));
  character.position.y = bounce * 0.22;
  character.scale.y = 1 + Math.sin(beat * 2) * 0.04;
  character.scale.x = character.scale.z = 1 - Math.sin(beat * 2) * 0.03;

  // Ancheggia e giro completo ogni tanto
  character.rotation.z = Math.sin(beat) * 0.12;
  const spinPhase = (t % 12) / 12;
  character.rotation.y = spinPhase > 0.85
    ? THREE.MathUtils.smoothstep(spinPhase, 0.85, 1) * Math.PI * 2
    : Math.sin(beat / 2) * 0.35;

  // Testa: bob e tilt a tempo
  head.rotation.z = Math.sin(beat + 0.5) * 0.18;
  head.rotation.x = Math.sin(beat * 2) * 0.06;
  head.rotation.y = Math.sin(beat / 2) * 0.25;

  // Orecchie che sventolano
  ears[0].rotation.z = Math.sin(beat * 2) * 0.22 + 0.1;
  ears[1].rotation.z = -Math.sin(beat * 2 + 0.4) * 0.22 - 0.1;

  // Braccia alternate su e giù (stile "raise the roof")
  arms[0].rotation.z = 0.5 + Math.sin(beat) * 0.9;
  arms[1].rotation.z = -0.5 + Math.sin(beat + Math.PI) * 0.9;
  arms[0].rotation.x = Math.sin(beat * 2) * 0.25;
  arms[1].rotation.x = Math.sin(beat * 2 + Math.PI) * 0.25;

  // Felci che ondeggiano nella brezza
  for (let i = 0; i < ferns.length; i++) {
    ferns[i].rotation.z = Math.sin(t * 1.2 + i) * 0.06;
  }

  // Nebbia che scorre
  for (let i = 0; i < mists.length; i++) {
    mists[i].position.x += 0.0015 * (i % 2 ? 1 : -1);
    if (mists[i].position.x > 6) mists[i].position.x = -6;
    if (mists[i].position.x < -6) mists[i].position.x = 6;
    mists[i].lookAt(camera.position);
  }

  // Particelle fluttuanti
  const pos = particles.geometry.attributes.position;
  for (let i = 0; i < pCount; i++) {
    pos.array[i * 3 + 1] += Math.sin(t + i) * 0.0012;
    pos.array[i * 3] += Math.cos(t * 0.7 + i * 1.3) * 0.0008;
  }
  pos.needsUpdate = true;

  controls.update();
  renderer.render(scene, camera);
}
animate();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
